model_name: Qwen/Qwen2.5-1.5B-Instruct
seed: 42

max_length: 512

learning_rate: 2.0e-4
batch_size: 2
gradient_accumulation_steps: 16
epochs: 3

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

weight_decay: 0.01
warmup_ratio: 0.03
logging_steps: 25

gradient_checkpointing: true